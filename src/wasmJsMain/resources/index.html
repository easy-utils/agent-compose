<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- viewport: NO `viewport-fit=cover`.
       The three runtimes size themselves differently — Flutter reads
       window.innerHeight/visualViewport, webui uses 100dvh, Compose measures
       its mount element — and NONE of them applies env(safe-area-inset-*).
       With `cover`, the layout viewport extends UNDER the Android gesture bar /
       iOS home indicator, so the bottom ~48px (composer + tab bar) were painted
       off-screen in an INSTALLED PWA (a browser TAB looked fine because its
       chrome lives outside the viewport). Without `cover` the OS insets the
       viewport for us and every engine lands inside the safe area automatically
       — no per-platform CSS.
       (`interactive-widget=resizes-content` keeps the viewport shrinking when
       the soft keyboard opens, so the composer stays above it.)
       NOTE: Flutter's engine deletes this meta and injects its own WITHOUT
       `cover` already, so this is a no-op there and the fix for the others. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="EasyLab Agent — chat with the easy-rpc agent backend">
  <link rel="icon" href="favicon.png" />
  <link rel="apple-touch-icon" href="icons/Icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Easy Agent">
  <title>Easy Agent</title>
  <style>
    /* === GENERATED by tools/web-shell/gen.py — do not edit by hand. ===
       Shared web shell for the three EasyLab web clients (head, pre-boot splash,
       viewport). Per-app differences live in tools/web-shell/apps/<name>.json.
           python3 tools/web-shell/gen.py
           python3 tools/web-shell/gen.py --check   # drift guard */
    html, body { margin: 0; height: 100%; background: #ffffff; }
    @media (prefers-color-scheme: dark) { html, body { background: #0a0a0a; } }
    body { overflow: hidden; }
    /* Compose/Wasm renders through ComposeViewport: it clears this element and
       creates a canvas inside it, so it must be a normal block element (not a
       <canvas>). It sizes the canvas ONCE from this element's rect, and only
       re-measures when a window `resize` fires.
       `position: fixed; inset: 0` (NOT 100dvh): the layout-viewport box is the
       reliable measure on a cold PWA start, whereas dvh/vh could resolve to a
       stale value while the browser is still transitioning into standalone. */
    #ComposeTarget { position: fixed; inset: 0; display: block; }

    /* Pre-boot splash: shown until the app paints its first frame, then removed
       by the app boot script. Mirrors the shared LoadingScreen in every client:
       client MARK + "Easy Agent" + a ring. */
    #agent-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #ffffff; color: #1a1a1a;
      font-family: system-ui, -apple-system, 'Noto Sans SC', sans-serif;
    }
    @media (prefers-color-scheme: dark) { #agent-splash { background: #0a0a0a; color: #eeeeee; } }
    #agent-splash .mk {
      width: 40px; height: 40px; border-radius: 10px; background: #059669;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 600; font-size: 16px;
      font-family: ui-monospace, 'Noto Sans Mono', monospace;
    }
    #agent-splash .ti { font-size: 14px; }
    #agent-splash .rg {
      width: 24px; height: 24px; border-radius: 50%;
      border: 2px solid currentColor; border-top-color: transparent;
      opacity: .55; animation: agent-spin .8s linear infinite;
    }
    @keyframes agent-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="agent-splash">
    <div class="mk">EC</div>
    <div class="ti">Easy Agent</div>
    <div class="rg"></div>
  </div>
  <div id="ComposeTarget"></div>
  <script type="application/javascript" src="composeApp.js"></script>
  <script>
    // Remove the pre-boot splash once Compose has painted its canvas. A
    // MutationObserver on the mount is the reliable signal (the WASM runtime
    // injects its <canvas> there); a timeout is the safety net.
    //
    // Compose sizes the canvas ONCE from the mount rect and re-measures ONLY
    // on a window `resize` — it does NOT observe the element. On a cold start
    // in an INSTALLED PWA the viewport is briefly stale (the browser is still
    // switching to standalone), so the canvas was laid out too tall and the
    // composer / bottom tab bar sat below the visible area until the user
    // manually resized (which fired `resize` and fixed it until the next cold
    // start). Bridge element-size changes to a synthetic `resize` so Compose
    // re-measures when the viewport settles, rotates, or the keyboard opens.
    (function () {
      var target = document.getElementById('ComposeTarget');
      var splash = document.getElementById('agent-splash');
      function drop() { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }
      function nudge() {
        if (!target) return;
        var r = target.getBoundingClientRect();
        var key = Math.round(r.width) + 'x' + Math.round(r.height);
        if (key === nudge.last) return;
        nudge.last = key;
        window.dispatchEvent(new Event('resize'));
      }
      // Cold-start safety net: the viewport may settle with no observable event
      // AND Compose's `resize` listener may attach only after the wasm boots,
      // so force a dispatch regardless of whether the box changed.
      function kick() { nudge.last = null; nudge(); }
      if (target) {
        // Re-measure whenever the mount's box changes (viewport settle / rotate).
        if (window.ResizeObserver) new ResizeObserver(nudge).observe(target);
        window.addEventListener('load', kick);
        window.addEventListener('orientationchange', function () { setTimeout(kick, 100); });
        if (window.visualViewport) window.visualViewport.addEventListener('resize', kick);
        setTimeout(kick, 300);
        setTimeout(kick, 1000);
        setTimeout(kick, 2500);
        // Splash removal is driven by the first painted canvas.
        var obs = new MutationObserver(function () {
          if (target.querySelector('canvas')) { obs.disconnect(); drop(); }
        });
        obs.observe(target, { childList: true, subtree: true });
      }
      setTimeout(drop, 15000);
    })();
  </script>
</body>
</html>
